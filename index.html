<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1st Quarter Project | SKU Generator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%23111'/><text x='50' y='68' font-family='system-ui' font-weight='700' font-size='60' fill='white' text-anchor='middle'>S</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="particles-canvas"></canvas>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fa-solid fa-diamond me-1" style="font-size: 0.9rem;"></i> Skewer
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">
                            <i class="fa-solid fa-barcode me-1"></i> SKU Generator
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="receipt_generator.html">
                            <i class="fa-solid fa-mug-hot me-1"></i> Receipt Generator
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="glass-card">
                    <div class="glass-header">
                        <i class="fa-solid fa-barcode header-icon"></i>
                        <h3>SKU Generator</h3>
                        <small class="subtitle">Create unique stock keeping units</small>
                    </div>

                    <div class="card-body p-4">
                        <form id="sku-form">
                            <div class="mb-3">
                                <label for="category" class="form-label">
                                    <i class="fa-solid fa-tags"></i> Category
                                </label>
                                <select id="category" class="form-select">
                                    <option value="Perishables">Perishables</option>
                                    <option value="Beverages">Beverages</option>
                                    <option value="Disposables">Disposables</option>
                                    <option value="Packaging">Packaging</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="product_name" class="form-label">
                                    <i class="fa-solid fa-box"></i> Product Name
                                </label>
                                <input type="text" id="product_name" class="form-control" placeholder="e.g. Bottled Water">
                            </div>

                            <div class="mb-4">
                                <label for="quantity" class="form-label">
                                    <i class="fa-solid fa-warehouse"></i> Stock Quantity
                                </label>
                                <input type="number" id="quantity" class="form-control" placeholder="e.g. 50" min="0">
                            </div>

                            <div class="d-grid">
                                <input type="button" py-click="SKU_generator" value="Generate SKU"
                                       class="btn btn-glass btn-lg">
                            </div>
                        </form>

                        <hr class="my-4" style="border-color: rgba(255,255,255,0.06);">

                        <div id="sku_output">
                            <p class="text-center mb-0" style="color: rgba(255,255,255,0.3);">
                                <i class="fa-solid fa-barcode me-1"></i>
                                Your generated SKU will appear here.
                            </p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="text-center py-4">
        <div class="container">
            <p class="mb-0">
                SKU Generator - 1st Quarter Project
            </p>
        </div>
    </footer>

    <script src="particles.js"></script>
    <py-script src="main.py"></py-script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
