<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1st Quarter Project | Receipt Generator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%23111'/><text x='50' y='68' font-family='system-ui' font-weight='700' font-size='60' fill='white' text-anchor='middle'>S</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="particles-canvas"></canvas>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
Skewer
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
SKU Generator
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="receipt_generator.html">
Receipt Generator
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="glass-card">
                    <div class="glass-header">

                        <h3>OBMC Entrep Fair</h3>
                        <small class="subtitle">Group 1 - Kohi Shop</small>
                    </div>

                    <div class="card-body p-4">
                        <h5 class="mb-3" style="color: rgba(255,255,255,0.85); font-weight: 600;">Menu</h5>

                        <form id="order-form">
                            <div class="menu-item">
                                <div>
                                    <input class="form-check-input" type="checkbox" id="item1" value="99">
                                    <label id="item1-label" for="item1">Americano</label>
                                </div>
                                <span class="price">&#8369;99</span>
                            </div>

                            <div class="menu-item">
                                <div>
                                    <input class="form-check-input" type="checkbox" id="item2" value="129">
                                    <label id="item2-label" for="item2">Spanish Latte</label>
                                </div>
                                <span class="price">&#8369;129</span>
                            </div>

                            <div class="menu-item">
                                <div>
                                    <input class="form-check-input" type="checkbox" id="item3" value="189">
                                    <label id="item3-label" for="item3">Cold Brew Malt</label>
                                </div>
                                <span class="price">&#8369;189</span>
                            </div>

                            <div class="menu-item">
                                <div>
                                    <input class="form-check-input" type="checkbox" id="item4" value="159">
                                    <label id="item4-label" for="item4">Affogato</label>
                                </div>
                                <span class="price">&#8369;159</span>
                            </div>

                            <div class="menu-item">
                                <div>
                                    <input class="form-check-input" type="checkbox" id="item5" value="129">
                                    <label id="item5-label" for="item5">Caramel Macchiato</label>
                                </div>
                                <span class="price">&#8369;129</span>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="button" py-click="create_order" class="btn btn-glass btn-lg">
                                    Create Order
                                </button>
                            </div>
                        </form>

                        <hr class="my-4" style="border-color: rgba(255,255,255,0.06);">

                        <div id="show">
                            <p class="text-center mb-0" style="color: rgba(255,255,255,0.3);">
                                Your order summary will appear here.
                            </p>
                        </div>
                    </div>

                    <div class="card-footer text-center small py-3">
                        Select your items and click "Create Order"
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="text-center py-4">
        <div class="container">
            <p class="mb-0">
                SKU Generator - 1st Quarter Project Enzo &amp; Ethan
            </p>
        </div>
    </footer>

    <script src="particles.js"></script>
    <py-script src="main.py"></py-script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
